  <g font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#fff">
    <g transform="translate(0 82)"><rect width="940" height="70" fill="#0b1f38"/><text x="55" y="48">1</text><text x="175" y="48">JEFFREY MENA</text><text x="850" y="48" text-anchor="middle">RC</text></g>
    <g transform="translate(0 152)"><rect width="940" height="70" fill="#07182b"/><text x="55" y="48">2</text><text x="175" y="48">CHRIS PEREIRA</text><text x="850" y="48" text-anchor="middle">P</text></g>
    <g transform="translate(0 222)"><rect width="940" height="70" fill="#0b1f38"/><text x="55" y="48">3</text><text x="175" y="48">SEAN HANLEY</text><text x="850" y="48" text-anchor="middle">LC</text></g>
    <g transform="translate(0 292)"><rect width="940" height="70" fill="#07182b"/><text x="55" y="48">4</text><text x="175" y="48">JUSTIN GREEN</text><text x="850" y="48" text-anchor="middle">2B</text></g>
    <g transform="translate(0 362)"><rect width="940" height="70" fill="#0b1f38"/><text x="55" y="48">5</text><text x="175" y="48">RYAN MENDOZA</text><text x="850" y="48" text-anchor="middle">1B</text></g>
    <g transform="translate(0 432)"><rect width="940" height="70" fill="#07182b"/><text x="55" y="48">6</text><text x="175" y="48">ERIC GREENE</text><text x="850" y="48" text-anchor="middle">SS</text></g>
    <g transform="translate(0 502)"><rect width="940" height="70" fill="#0b1f38"/><text x="55" y="48">7</text><text x="175" y="48">MIKE GINSBURG</text><text x="850" y="48" text-anchor="middle">3B</text></g>
    <g transform="translate(0 572)"><rect width="940" height="70" fill="#07182b"/><text x="55" y="48">8</text><text x="175" y="48">SHANE MCDERMOTT</text><text x="850" y="48" text-anchor="middle">1B</text></g>
    <g transform="translate(0 642)"><rect width="940" height="70" fill="#0b1f38"/><text x="55" y="48">9</text><text x="175" y="48">JEREMY WRIGHT</text><text x="850" y="48" text-anchor="middle">C</text></g>
    <g transform="translate(0 712)"><rect width="940" height="88" fill="#07182b"/><text x="55" y="54">10</text><text x="175" y="54">SUB</text><text x="850" y="54" text-anchor="middle">RF</text></g>
  </g>
