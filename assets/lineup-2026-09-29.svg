  <text x="55" y="56" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">#</text>
  <text x="245" y="56" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">PLAYER</text>
