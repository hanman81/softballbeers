<g transform="translate(70 1490)">
  <text x="470" y="0" text-anchor="middle" fill="#c82026" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" letter-spacing="5">SEPTEMBER 29 · ALAMEDA, CA</text>
</g>
